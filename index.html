<!DOCTYPE html>
<html lang="en">
	<head>
		<meta name="viewport" content="initial-scale=1.0,width=device-width">
		<link rel="stylesheet" href="./styles.css">
		<title>Chessy remake</title>
	</head>
	<body class="flex-all-center">
		<header>
			<h1>Chessy remake</h1>
		</header>

		<main class="flex-all-center">
			<div id="app">
				<div id="numbers">
					<p></p>
					<p>1</p>
					<p>2</p>
					<p>3</p>
					<p>4</p>
					<p>5</p>
					<p>6</p>
					<p>7</p>
					<p>8</p>
				</div>
				
				<div id="choose-new-piece">
					<h2>Choose a new chess piece</h2>
					<div id="choose-queen">♛ Queen</div>
					<div id="choose-knight">♞ Knight</div>
					<div id="choose-rook">♜ Rook</div>
					<div id="choose-bishop">♝ Bishop</div>

				</div>
				<div id="board">
				</div>
				
				<div id="letters">
					<p>A</p>
					<p>B</p>
					<p>C</p>
					<p>D</p>
					<p>E</p>
					<p>F</p>
					<p>G</p>
					<p>H</p>
				</div>
			</div>
			<script src="./index.js" type="module"></script>
		</main>

		<footer>
			<p>2024</p>
		</footer>
	</body>
</html>
